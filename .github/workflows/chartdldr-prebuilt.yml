---
# Build chartdldr_pi drop-in libraries for fork testers.
# Push a tag chartdldr-v* on this branch to create a GitHub Release.
name: Chart Downloader prebuilt

on:
  push:
    branches:
      - cursor/chartdldr-prebuilt-release
    tags:
      - chartdldr-v*
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CONFIGURATION: Release

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: ./ci/github-pre-build.sh
      - name: Build chartdldr_pi
        run: ./ci/chartdldr-plugin-build.sh
      - name: Package artifact
        run: |
          VERSION="${GITHUB_REF_NAME#chartdldr-v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="$(grep VERSION_MAJOR plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/').$(grep VERSION_MINOR plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/').$(grep VERSION_PATCH plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/')-pre.${GITHUB_RUN_NUMBER}"
          fi
          ./ci/package-chartdldr-artifact.sh linux-amd64 "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: chartdldr-linux-amd64
          path: artifact/*.zip

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: ./ci/github-pre-build.sh
      - name: Build chartdldr_pi
        run: ./ci/chartdldr-plugin-build.sh
      - name: Package artifact
        run: |
          VERSION="${GITHUB_REF_NAME#chartdldr-v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="$(grep VERSION_MAJOR plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/').$(grep VERSION_MINOR plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/').$(grep VERSION_PATCH plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/')-pre.${GITHUB_RUN_NUMBER}"
          fi
          ./ci/package-chartdldr-artifact.sh linux-arm64 "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: chartdldr-linux-arm64
          path: artifact/*.zip

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSVC
        uses: seanmiddleditch/gha-setup-vsdevenv@v3
        with:
          host_arch: x86
          arch: win32
      - name: Build chartdldr_pi
        shell: cmd
        env:
          CONFIGURATION: Release
        run: ci\chartdldr-plugin-build-win.bat
      - name: Package artifact
        run: |
          VERSION="${GITHUB_REF_NAME#chartdldr-v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="$(grep VERSION_MAJOR plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/').$(grep VERSION_MINOR plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/').$(grep VERSION_PATCH plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/')-pre.${GITHUB_RUN_NUMBER}"
          fi
          ./ci/package-chartdldr-artifact.sh windows "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: chartdldr-windows
          path: artifact/*.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew list --versions cmake || brew install cmake
          brew list --versions wxwidgets@3.2 || brew install wxwidgets@3.2
          brew list --versions libarchive || brew install libarchive
          brew list --versions gettext || brew install gettext
          if [ -d /opt/homebrew/include ]; then
            ln -sf /opt/homebrew/opt/libarchive/include/archive.h /opt/homebrew/include/archive.h || true
            ln -sf /opt/homebrew/opt/libarchive/include/archive_entry.h /opt/homebrew/include/archive_entry.h || true
          fi
      - name: Build chartdldr_pi
        run: ./ci/chartdldr-plugin-build.sh
      - name: Package artifact
        run: |
          VERSION="${GITHUB_REF_NAME#chartdldr-v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="$(grep VERSION_MAJOR plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/').$(grep VERSION_MINOR plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/').$(grep VERSION_PATCH plugins/chartdldr_pi/CMakeLists.txt | head -1 | sed 's/.*"\(.*\)".*/\1/')-pre.${GITHUB_RUN_NUMBER}"
          fi
          ./ci/package-chartdldr-artifact.sh macos "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: chartdldr-macos
          path: artifact/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/chartdldr-v')
    needs:
      - linux-amd64
      - linux-arm64
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Chart Downloader ${{ github.ref_name }}
          body: |
            Prebuilt **chartdldr_pi** from branch `cursor/chartdldr-prebuilt-release`
            (scheduled bulk update fork build).

            Download the zip for your platform, read `INSTALL.txt` inside, quit OpenCPN,
            then copy the library and `chartdldr_pi` data folder into your install.

            **Assets:** Linux amd64, Linux arm64, Windows (32-bit OpenCPN), macOS arm64.
            Android/Flatpak are not included; build from source on this branch if needed.

            Commit: ${{ github.sha }}
          files: dist/*.zip
          draft: false
          prerelease: true
